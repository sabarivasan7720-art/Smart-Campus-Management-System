<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fusion Café · Excel Engineering College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: "#0B1F4B", gold: "#C9A227", cream: "#F7F3EA" },
          fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body class="bg-cream text-navy">
  <header class="sticky top-0 z-40 bg-navy text-cream">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/logo.svg" alt="" class="h-10 w-10" />
        <span class="text-sm font-extrabold tracking-wide text-gold">EXCEL ENGINEERING COLLEGE</span>
      </a>
      <nav class="hidden gap-1 text-sm font-medium md:flex">
        <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="index.html">Map</a>
        <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="qr.html">QR Routes</a>
        <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="portal.html">Portal</a>
        <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="hostel.html">Hostel</a>
        <a class="rounded-lg px-3 py-2 hover:bg-white/10" href="placement.html">Placement</a>
        <a class="rounded-lg bg-gold/20 px-3 py-2 text-gold" href="cafe.html">Fusion Café</a>
      </nav>
      <a class="md:hidden text-sm" href="index.html">Map</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-10">
    <div class="mb-8 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-3xl font-extrabold">Excel Fusion Café</h1>
        <p class="text-slate-600">Spot 15 on the campus map · Hours <span id="hours">—</span></p>
      </div>
      <a href="index.html" class="text-sm font-semibold underline decoration-gold">Walk there from Main Gate</a>
    </div>
    <div class="grid gap-8 lg:grid-cols-[1fr_300px]">
      <div id="menu" class="space-y-8"></div>
      <aside class="h-fit rounded-2xl bg-white p-5 ring-1 ring-navy/10 lg:sticky lg:top-24">
        <h2 class="font-bold">Token cart</h2>
        <div id="cart" class="mt-3"></div>
        <p class="mt-4 flex justify-between font-extrabold"><span>Total</span><span id="total">₹0</span></p>
        <button id="place-order" class="mt-4 w-full rounded-xl bg-navy py-3 font-semibold text-gold">Place token order</button>
        <p id="ticket" class="mt-3 hidden rounded-xl bg-gold/20 p-3 text-sm"></p>
        <p class="mt-3 text-xs text-slate-500">Placeholder checkout — no payment is processed.</p>
      </aside>
    </div>
  </main>
  <footer class="mt-10 bg-navy py-8 text-sm text-cream/80">
    <div class="mx-auto max-w-7xl px-4">Fusion Café · Excel Engineering College</div>
  </footer>
  <script src="js/cafe.js"></script>
</body>
</html>
