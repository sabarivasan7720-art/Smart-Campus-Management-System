      <text x="820" y="632" fill="#fff" font-size="13" font-weight="800">10  A - A4</text>
      <text x="820" y="654" fill="#d7f3f5" font-size="12">Mech &amp; Aero</text>
    </g>
    <!-- 11 CSE -->
