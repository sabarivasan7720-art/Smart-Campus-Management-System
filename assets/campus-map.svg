      <rect x="1270" y="920" width="220" height="120" rx="12" fill="#1b6b73"/>
      <text x="1380" y="972" fill="#fff" font-size="14" font-weight="800">5  S&amp;H - ECE</text>
      <text x="1380" y="994" fill="#d7f3f5" font-size="12">Academic block</text>
    </g>
