      <rect x="1480" y="330" width="200" height="100" rx="12" fill="#1b6b73"/>
      <text x="1580" y="372" fill="#fff" font-size="13" font-weight="800">16  A2  ECCS</text>
      <text x="1580" y="394" fill="#d7f3f5" font-size="11">Fashion - Viscom - Bio</text>
    </g>
    <!-- 17 Architecture -->
    <g filter="url(#shadow)">
      <rect x="1670" y="210" width="180" height="100" rx="12" fill="#1b6b73"/>
      <text x="1760" y="252" fill="#fff" font-size="13" font-weight="800">17  A5 ARCH</text>
      <text x="1760" y="274" fill="#d7f3f5" font-size="11">Architecture</text>
    </g>
