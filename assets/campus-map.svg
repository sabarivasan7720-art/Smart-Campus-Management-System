    <g filter="url(#shadow)">
      <rect x="1010" y="110" width="220" height="100" rx="12" fill="#1b6b73"/>
      <text x="1120" y="152" fill="#fff" font-size="13" font-weight="800">19  B3 - B5 POLY</text>
      <text x="1120" y="174" fill="#d7f3f5" font-size="11">Polytechnic College</text>
