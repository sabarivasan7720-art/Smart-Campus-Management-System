      <text x="1480" y="690" fill="#C9A227" font-size="13" font-weight="800">13  NURSING - HR</text>
      <text x="1480" y="712" fill="#F7F3EA" font-size="12">Placement Cell</text>
    </g>
    <!-- 14 Girls -->
