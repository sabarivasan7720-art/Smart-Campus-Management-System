      <rect x="1425" y="115" width="190" height="90" rx="12" fill="#1b6b73"/>
      <text x="1520" y="155" fill="#fff" font-size="13" font-weight="800">18  A6 EDUCATION</text>
      <text x="1520" y="176" fill="#d7f3f5" font-size="11">College of Education</text>
    </g>
