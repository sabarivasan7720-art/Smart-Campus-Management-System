  <!-- Title plate -->
  <rect x="60" y="48" width="520" height="78" rx="14" fill="#0B1F4B"/>
  <text x="86" y="82" fill="#C9A227" font-family="Segoe UI, Arial" font-size="22" font-weight="800">EXCEL ENGINEERING COLLEGE</text>
  <text x="86" y="106" fill="#F7F3EA" font-family="Segoe UI, Arial" font-size="13">Komarapalayam - Schematic visitor map</text>

  <!-- North -->
  <g transform="translate(1880,80)">
    <circle r="28" fill="#F7F3EA" stroke="#0B1F4B" stroke-width="3"/>
    <polygon points="0,-16 8,10 -8,10" fill="#0B1F4B"/>
    <text y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#0B1F4B">N</text>
  </g>
</svg>
