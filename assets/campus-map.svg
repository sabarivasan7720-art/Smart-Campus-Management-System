<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400">
  <defs>
    <pattern id="grass" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#c8d9b8"/>
      <circle cx="6" cy="8" r="1.2" fill="#b7ccA6"/>
      <circle cx="20" cy="18" r="1.1" fill="#d5e4c8"/>
    </pattern>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a958c"/>
      <stop offset="1" stop-color="#8a857c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1F4B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="2000" height="1400" fill="url(#grass)"/>
  <rect x="24" y="24" width="1952" height="1352" rx="28" fill="none" stroke="#0B1F4B" stroke-width="8"/>

  <!-- NH-544 strip -->
  <rect x="24" y="1310" width="1952" height="66" fill="#5c5852"/>
  <line x1="40" y1="1343" x2="1960" y2="1343" stroke="#C9A227" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="1000" y="1368" text-anchor="middle" fill="#F7F3EA" font-family="Segoe UI, Arial" font-size="18" font-weight="700">NH-544 - Salem Main Road - Main Gate</text>

  <!-- Roads -->
  <g fill="#8f8a81" stroke="#7a756c" stroke-width="1">
    <rect x="978" y="160" width="44" height="1180" rx="8"/>
    <rect x="140" y="1076" width="1560" height="38" rx="8"/>
    <rect x="140" y="682" width="1720" height="38" rx="8"/>
    <rect x="280" y="216" width="1550" height="36" rx="8"/>
    <rect x="326" y="216" width="38" height="880" rx="8"/>
    <rect x="1426" y="160" width="38" height="940" rx="8"/>
    <rect x="1720" y="682" width="80" height="38" rx="8"/>
  </g>
  <g stroke="#efe9d8" stroke-width="2" stroke-dasharray="12 10" fill="none">
    <line x1="1000" y1="180" x2="1000" y2="1310"/>
    <line x1="160" y1="1095" x2="1680" y2="1095"/>
    <line x1="160" y1="701" x2="1840" y2="701"/>
    <line x1="300" y1="234" x2="1800" y2="234"/>
  </g>

  <!-- Trees -->
  <g fill="#5f8a4a">
    <circle cx="90" cy="400" r="18"/><circle cx="120" cy="430" r="14"/>
    <circle cx="90" cy="800" r="16"/><circle cx="1910" cy="400" r="18"/>
    <circle cx="1880" cy="900" r="15"/><circle cx="90" cy="250" r="12"/>
    <circle cx="760" cy="1050" r="14"/><circle cx="430" cy="400" r="13"/>
  </g>

