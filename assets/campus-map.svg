      <rect x="1075" y="585" width="210" height="110" rx="12" fill="#1b6b73"/>
      <text x="1180" y="632" fill="#fff" font-size="13" font-weight="800">11  CSE - CS - BS</text>
      <text x="1180" y="654" fill="#d7f3f5" font-size="12">Computer Science</text>
