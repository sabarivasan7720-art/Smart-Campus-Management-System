  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <!-- 1 Welcome -->
    <g filter="url(#shadow)">
      <rect x="880" y="1195" width="240" height="90" rx="12" fill="#0B1F4B"/>
      <text x="1000" y="1236" fill="#C9A227" font-size="15" font-weight="800">1  WELCOME BLOCK</text>
      <text x="1000" y="1258" fill="#F7F3EA" font-size="12">Main Entrance - Reception</text>
    </g>
    <!-- 2 Temple -->
    <g filter="url(#shadow)">
      <rect x="400" y="1170" width="160" height="100" rx="50" fill="#C9A227"/>
      <text x="480" y="1218" fill="#0B1F4B" font-size="14" font-weight="800">2  TEMPLE</text>
      <text x="480" y="1238" fill="#0B1F4B" font-size="11">Rain water tank 2A</text>
    </g>
    <!-- 3 School -->
